<div id="tile-{{sensor.id}}" hx-get="/sensor/{{sensor.id}}/tile?variant=default" hx-trigger="load, every 1s" hx-swap="outerHTML" class="bg-white rounded-lg shadow p-4">
  <div class="flex items-center justify-between">
    <div class="text-lg font-semibold">{{sensor.name}}</div>
    <div class="text-xs text-gray-500">ID: {{sensor.id}}</div>
  </div>

  <div class="mt-3 grid grid-cols-3 gap-2 text-center">
    <div class="p-3 bg-gray-50 rounded">
      <div class="text-gray-500 text-sm">Gas</div>
      <div class="text-xl font-medium">{{reading.gas}}</div>
    </div>
    <div class="p-3 bg-gray-50 rounded">
      <div class="text-gray-500 text-sm">Temp</div>
      <div class="text-xl font-medium">{{reading.temperature}} °C</div>
    </div>
    <div class="p-3 bg-gray-50 rounded">
      <div class="text-gray-500 text-sm">Humidity</div>
      <div class="text-xl font-medium">{{reading.humidity}} %</div>
    </div>
  </div>

  <div class="mt-3 text-xs text-gray-400">Updated {{reading.ts}}</div>
</div>
